<!-- BookShelf Automated SVG Cover - ID 40: 1984 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-40" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="100%" stop-color="#0C0A09" />
    </linearGradient>
    
        <pattern id="pat-40" width="30" height="30" patternUnits="userSpaceOnUse">
          <path d="M 0 15 Q 15 5 30 15" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
        </pattern>
  </defs>

  <!-- Background Base & Pattern -->
  <rect width="300" height="420" fill="url(#bg-40)" rx="8"/>
  <rect width="300" height="420" fill="url(#pat-40)" rx="8"/>

  <!-- Geometric Emblem / Art Motif -->
  <circle cx="215" cy="140" r="14" fill="#EF4444" opacity="0.7"/>
              <path d="M 175 140 Q 215 105 255 140 Q 215 175 175 140 Z" fill="none" stroke="#EF4444" stroke-width="2.5" opacity="0.45"/>

  <!-- Book Spine 3D Texture Effect -->
  <rect x="0" y="0" width="16" height="420" fill="rgba(0,0,0,0.42)" rx="8"/>
  <rect x="16" y="0" width="3" height="420" fill="rgba(255,255,255,0.2)"/>
  <rect x="19" y="0" width="6" height="420" fill="rgba(0,0,0,0.15)"/>

  <!-- Top Genre Badge with accurate numeric width -->
  <rect x="36" y="36" width="67" height="24" rx="4" fill="rgba(0,0,0,0.4)" stroke="#EF4444" stroke-width="1.2"/>
  <text x="69.5" y="52" fill="#EF4444" font-size="10.5" font-family="'JetBrains Mono', monospace" font-weight="800" letter-spacing="1" text-anchor="middle">SCI-FI</text>

  <!-- Star Rating Watermark -->
  <g transform="translate(230, 42)">
    <circle cx="12" cy="10" r="14" fill="rgba(0,0,0,0.3)"/>
    <text x="12" y="14" fill="#FBBF24" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle">★</text>
  </g>

  <!-- Title Section -->
  <g>
    <text x="36" y="135" fill="#FFFFFF" font-size="28" font-family="'Archivo Black', 'Inter', sans-serif" font-weight="900" letter-spacing="-0.5">1984</text>
  </g>

  <!-- Divider Line -->
  <line x1="36" y1="182" x2="260" y2="182" stroke="#EF4444" stroke-width="2" opacity="0.6"/>

  <!-- Subtitle -->
  <text x="36" y="204" fill="rgba(255,255,255,0.85)" font-size="12" font-family="'Inter', sans-serif" font-weight="500">Big Brother Is Watching</text>

  <!-- Bottom Section: Author & Year -->
  <g transform="translate(0, 360)">
    <text x="36" y="10" fill="#FFFFFF" font-size="14" font-family="'Inter', sans-serif" font-weight="700">Md Salahuddin</text>
    <text x="36" y="30" fill="rgba(255,255,255,0.6)" font-size="11" font-family="'JetBrains Mono', monospace">Edition 2021 • BookShelf</text>
  </g>
</svg>
