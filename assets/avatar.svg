<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" class="w-full h-full rounded-full">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="avatarBackdrop" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="ringGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Skin Tones with 3D Depth -->
    <linearGradient id="skinTone" x1="80" y1="40" x2="80" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="70%" stop-color="#fba86c" />
      <stop offset="100%" stop-color="#e07a3c" />
    </linearGradient>
    <linearGradient id="neckShadow" x1="80" y1="90" x2="80" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d96827" />
      <stop offset="100%" stop-color="#c25418" />
    </linearGradient>

    <!-- Hair Tone -->
    <linearGradient id="hairGrad" x1="50" y1="20" x2="110" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Hoodie / Clothing -->
    <linearGradient id="hoodieGrad" x1="40" y1="110" x2="120" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Subtle Shadows -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Circle Background -->
  <circle cx="80" cy="80" r="78" fill="url(#avatarBackdrop)" />
  <circle cx="80" cy="80" r="78" stroke="url(#ringGlow)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Clothing / Hoodie Body -->
  <g filter="url(#softGlow)">
    <path d="M26 154C26 128 46 112 80 112C114 112 134 128 134 154" fill="url(#hoodieGrad)" />
    <!-- Hoodie Strings & Center Seam -->
    <path d="M80 120V154" stroke="#1e40af" stroke-width="2.5" stroke-linecap="round" />
    <path d="M68 122C68 132 66 142 66 146" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
    <path d="M92 122C92 132 94 142 94 146" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
    <circle cx="66" cy="147" r="2" fill="#bfdbfe" />
    <circle cx="94" cy="147" r="2" fill="#bfdbfe" />
    <!-- Collar Cutout -->
    <path d="M64 112C64 122 72 130 80 130C88 130 96 122 96 112" fill="#0f172a" />
  </g>

  <!-- Neck -->
  <rect x="70" y="92" width="20" height="24" rx="10" fill="url(#neckShadow)" />

  <!-- Head / Face Structure -->
  <g filter="url(#softGlow)">
    <ellipse cx="80" cy="72" rx="30" ry="34" fill="url(#skinTone)" />
  </g>

  <!-- Ears with Detailing -->
  <ellipse cx="50" cy="72" rx="6" ry="8" fill="#fba86c" />
  <ellipse cx="50" cy="72" rx="3" ry="5" fill="#e07a3c" />
  <ellipse cx="110" cy="72" rx="6" ry="8" fill="#fba86c" />
  <ellipse cx="110" cy="72" rx="3" ry="5" fill="#e07a3c" />

  <!-- Hair Cut & Top Layers -->
  <path d="M49 68C49 46 59 30 80 30C101 30 111 46 111 68C111 62 104 50 80 50C56 50 49 62 49 68Z" fill="url(#hairGrad)" />
  <!-- Hair Volume Waves -->
  <path d="M49 58C52 44 65 38 80 38C98 38 106 46 111 54C108 42 96 34 80 34C62 34 52 44 49 58Z" fill="#475569" opacity="0.6" />
  <!-- Hair Parting Accent -->
  <path d="M60 33C70 27 90 27 100 35" stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.5" />

  <!-- Eyes & Eyebrows -->
  <g>
    <!-- Eyebrows -->
    <path d="M61 60C64 58 72 58 74 61" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M86 61C88 58 96 58 99 60" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eye Sockets -->
    <ellipse cx="67" cy="69" rx="4" ry="4" fill="#0f172a" />
    <ellipse cx="93" cy="69" rx="4" ry="4" fill="#0f172a" />
    
    <!-- Highlights in Eyes -->
    <circle cx="68.5" cy="67.5" r="1.5" fill="#ffffff" />
    <circle cx="94.5" cy="67.5" r="1.5" fill="#ffffff" />
  </g>

  <!-- Modern Sleek Glasses -->
  <g>
    <rect x="57" y="62" width="20" height="15" rx="5" fill="none" stroke="#0f172a" stroke-width="2.5" />
    <rect x="83" y="62" width="20" height="15" rx="5" fill="none" stroke="#0f172a" stroke-width="2.5" />
    <!-- Glasses Bridge -->
    <path d="M77 68H83" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
    <!-- Glasses Glare Reflection -->
    <path d="M60 65L72 73" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
    <path d="M86 65L98 73" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Nose -->
  <path d="M80 72V79C80 80.5 78.5 81.5 77 81.5" stroke="#d96827" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Confident Smile -->
  <path d="M72 87C74 91 86 91 88 87" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" fill="none" />
</svg>
