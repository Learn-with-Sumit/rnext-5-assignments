<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Expense Tracker | Empty State Preview</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type="text/tailwindcss">
    @theme {
      --color-primary: #FAD4C0;
      --color-secondary: #80A1C1;
      --color-surface: #FFF5E6;
      --color-text-main: #111827;
      --color-text-muted: #6B7280;
    }
  </style>
</head>
<body class="min-h-screen bg-[#FAFAF7] text-[#111827] flex flex-col font-sans">

  <main class="flex-1 max-w-4xl mx-auto px-4 py-16 flex items-center justify-center">
    <!-- "List is empty!" State Component -->
    <div class="bg-white rounded-3xl p-12 text-center border border-dashed border-[#111827]/20 shadow-sm max-w-md w-full">
      <img src="assets/empty-state.svg" alt="Empty state" class="w-36 h-36 mx-auto mb-5" />
      <h3 class="text-xl font-bold text-[#111827]">List is empty!</h3>
      <p class="text-sm text-[#6B7280] mt-2 mb-6">
        You haven't recorded any expenses yet. Keep your finances organized by adding your first transaction.
      </p>
      <a
        href="modal.html"
        class="inline-flex items-center gap-2 bg-[#FAD4C0] hover:bg-[#f5c0a7] text-[#111827] px-6 py-3 rounded-xl font-semibold text-sm transition-all shadow-sm border border-[#111827]/10"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        <span>Add First Expense</span>
      </a>
    </div>
  </main>
</body>
</html>
